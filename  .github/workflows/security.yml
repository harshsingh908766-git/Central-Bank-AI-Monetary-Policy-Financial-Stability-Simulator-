
name: Security Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:

  dependency-audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
